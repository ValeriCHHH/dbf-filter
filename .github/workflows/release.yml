name: Build and Release

on:
  push:
    tags:
      - 'v*'

jobs:
  # =======================================================
  # 1. СБОРКА ПАКЕТОВ ДЛЯ LINUX (.deb и .rpm)
  # =======================================================
  build-linux:
    runs-on: ubuntu-latest
    steps:
      - name: Чтение исходного кода
        uses: actions/checkout@v5

      - name: Установка инструментов сборки (dpkg и rpm)
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev rpm alien

      - name: Подготовка структуры для DEB пакета
        run: |
          mkdir -p build/deb/dbf-filter/DEBIAN
          mkdir -p build/deb/dbf-filter/usr/bin


          cp src/dbf_to_csv.py build/deb/dbf-filter/usr/bin/dbf-filter
          chmod +x build/deb/dbf-filter/usr/bin/dbf-filter

          VERSION="${GITHUB_REF_NAME#v}"

          echo "Package: dbf-filter" > build/deb/dbf-filter/DEBIAN/control
          echo "Version: ${VERSION}" >> build/deb/dbf-filter/DEBIAN/control
          echo "Section: utils" >> build/deb/dbf-filter/DEBIAN/control
          echo "Priority: optional" >> build/deb/dbf-filter/DEBIAN/control
          echo "Architecture: all" >> build/deb/dbf-filter/DEBIAN/control
          echo "Depends: python3, python3-dbfread" >> build/deb/dbf-filter/DEBIAN/control
          echo "Maintainer: Stepanchuk Valeriy <valerik.shadowman@gmail.com>" >> build/deb/dbf-filter/DEBIAN/control
          echo "Description: Utility for filtering DBF files and converting to CSV" >> build/deb/dbf-filter/DEBIAN/control

          dpkg-deb --build build/deb/dbf-filter dbf-filter_${VERSION}_all.deb

      - name: Конвертация DEB в RPM
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          sudo alien -r -k dbf-filter_${VERSION}_all.deb

      - name: Загрузка готовых пакетов в артефакты
        uses: actions/upload-artifact@v5
        with:
          name: linux-packages
          path: |
            *.deb
            *.rpm

  # =======================================================
  # 2. СБОРКА ИСПОЛНЯЕМОГО ФАЙЛА ДЛЯ WINDOWS (.exe)
  # =======================================================
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Чтение исходного кода
        uses: actions/checkout@v5

      - name: Настройка Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Установка зависимостей
        run: |
          python -m pip install --upgrade pip
          pip install setuptools pyinstaller dbfread

      - name: Сборка в автономный .exe с помощью PyInstaller
        run: |
          pyinstaller --onefile --name dbf-filter src/dbf_filter.py

      - name: Загрузка .exe в артефакты
        uses: actions/upload-artifact@v5
        with:
          name: windows-binary
          path: dist/dbf-filter.exe

  # =======================================================
  # 3. ПУБЛИКАЦИЯ ГОТОВЫХ ФАЙЛОВ В GITHUB RELEASES
  # =======================================================
  create-release:
    needs: [build-linux, build-windows]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Скачивание всех собранных артефактов
        uses: actions/download-artifact@v5

      - name: Публикация релиза на GitHub
        uses: softprops/action-gh-release@v2
        with:
          files: |
            linux-packages/*.deb
            linux-packages/*.rpm
            windows-binary/dbf-filter.exe
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
